[package]
name = "curb"
description = "Calimero chat"
version = "2.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

# Read by `cargo mero bundle` (core #3374): every field the node and the
# registry render now has a producer here, so nothing hand-writes a
# manifest.json. `appVersion` is deliberately absent — the deploy workflow
# resolves it from the registry with `--bump patch`.
[package.metadata.calimero]
package = "com.calimero.curb"
name = "Mero Chat"
description = "Mero Chat v2 — group-based context management. Each context is one channel or DM."
author = "Calimero"
# The desktop resolves a deep link (calimero://<slug>/join and
# https://links.calimero.network/<slug>/join) by Application.package, so the
# slug IS the package id — keep it equal to `APP_SLUG` in
# app/src/utils/invitation.ts or shared invites stop opening the app.
slug = "com.calimero.curb"
icon = "../app/public/icons/icon-512x512.png"
license = "MIT"
tags = ["chat", "messaging", "social"]
github = "https://github.com/calimero-network/mero-chat"
min-runtime-version = "0.1.0"
frontend = "https://mero-chat.vercel.app/"

[dependencies]
base64 = "0.23.0"
borsh = "1.6.1"
borsh-derive = "1.6.1"
bs58 = "0.5.1"
# Pin a real release tag, never `branch = "master"`: master rides unreleased
# protocol work against nodes that run the release. All SDK crates must share
# the exact same tag (the workspace version at a tag is 0.0.0).
calimero-sdk = { git = "https://github.com/calimero-network/core.git", tag = "0.11.0-rc.20" }
calimero-storage = { git = "https://github.com/calimero-network/core.git", tag = "0.11.0-rc.20" }
calimero-storage-macros = { git = "https://github.com/calimero-network/core.git", tag = "0.11.0-rc.20" }
thiserror = "1.0.56"

[dev-dependencies]
# Enables register_crdt_merge + the native mock host so TestHost can drive the
# AccessControl writer-set state under `cargo test`.
calimero-storage = { git = "https://github.com/calimero-network/core.git", tag = "0.11.0-rc.20", features = ["testing"] }

[profile.app-release]
inherits = "release"
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
